# Colors follow the current Omarchy theme (reloaded live on theme switch).
# Settings below override Omarchy's defaults in /etc/xdg/kitty/kitty.conf.
include ~/.local/state/omarchy/current/theme/kitty.conf

confirm_os_window_close 0

# WINDOW
hide_window_decorations titlebar-only

# FONTS
font_family      family="MesloLGM Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        9


# MAPS
# map ctrl+v paste_from_clipboard

map shift+enter send_text all \x1b[13;2u
map ctrl+enter send_text all \x1b[13;5u


# kitty-scrollback
allow_remote_control socket-only
shell_integration enabled

# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten '/home/katt/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py'
# Browse scrollback buffer in nvim
map kitty_mod+h kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output
